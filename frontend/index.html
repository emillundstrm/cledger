<!doctype html>
<html lang="sv" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080e15" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CLedger" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <title>CLedger</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          if (localStorage.getItem("cledger-theme") === "light") {
            document.documentElement.classList.remove("dark")
          }
        } catch (e) {
          // localStorage unavailable
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
